name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          mkdir app
          unzip -q awrad_project_for_github.zip -d app

      - name: Create Android platform
        working-directory: app
        run: flutter create --platforms=android --org com.ahmedbahrawy .

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk "awrad-anwar-muhammadiya.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awrad-anwar-muhammadiya-apk
          path: awrad-anwar-muhammadiya.apk
          retention-days: 30
